name: Signal Atlas - sync source dashboards and publish

on:
  schedule:
    # GitHub cron is UTC. First run after upstream macro-market's morning refresh.
    - cron: '30 1 * * 1-6'   # 10:30 KST Monday-Saturday
    - cron: '30 10 * * 1-5'  # 19:30 KST weekdays
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-atlas-v4-publish
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fallback price provider
        run: python -m pip install -r requirements.txt
      - name: Test strategy, PDF extractor and feed mapping without network
        run: |
          node tests/test-parser.js
          node tests/test-strategy.js
          node tests/test-q3-filings.js
          python tests/test-collector.py
          python tests/test-extra.py
      - name: Sync Macro Dashboard, KR Trade Monitor, FactSet, FRED and WGC
        run: python collect.py
      - name: Commit refreshed public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync macro and Korea trade indicators"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Prepare static Pages site
        run: |
          mkdir -p public/assets
          cp index.html data.json public/
          cp assets/*.js assets/*.css public/assets/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

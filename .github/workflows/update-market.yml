name: Signal Atlas - refresh market and publish dashboard
on:
  schedule:
    - cron: '30 9 * * 1-5' # Weekdays 18:30 Korea time; US latest close may be previous date
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: signal-atlas-capex-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install market collector
        run: python -m pip install -r requirements.txt
      - name: Run rule and PDF parsing tests
        run: |
          node tests/test-parser.js
          node tests/test-strategy.js
          node tests/test-q3-filings.js
          python tests/test-collector.py
      - name: Update market snapshot (retain existing snapshot if provider fails)
        continue-on-error: true
        run: python collect.py
      - name: Commit latest public market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh market snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Prepare GitHub Pages
        run: |
          mkdir -p public/assets
          cp index.html data.json public/
          cp assets/*.js assets/*.css public/assets/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
